apiVersion: apps/v1
kind: Deployment
metadata:
  name: ice-engine
  namespace: ice-system
  labels:
    app: ice-engine
    version: v2.7.756
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ice-engine
  template:
    metadata:
      labels:
        app: ice-engine
    spec:
      containers:
      - name: ice-engine
        image: your-private-registry/ice:2.7.756
        ports:
        - containerPort: 8000
        resources:
          limits:
            memory: "32Gi"
            cpu: "16"
          requests:
            memory: "8Gi"
            cpu: "4"
        env:
        # --- SENSITIVE SECRETS ---
        - name: ICE_LICENSE_JWT
          valueFrom:
            secretKeyRef:
              name: ice-secrets
              key: license-jwt
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: ice-secrets
              key: database-url
        
        # --- GLOBAL CONFIGMAP TUNING ---
        - name: ICE_MEMORY_CAP_GB
          valueFrom:
            configMapKeyRef:
              name: ice-config
              key: memory-cap-gb
        - name: ICE_MAX_STITCH_CONCURRENCY
          valueFrom:
            configMapKeyRef:
              name: ice-config
              key: max-stitch-concurrency
        - name: ICE_CHUNK_SIZE
          value: "12000"
        
        livenessProbe:
          httpGet:
            path: /v1/health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /v1/health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ice-engine-svc
  namespace: ice-system
spec:
  selector:
    app: ice-engine
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: LoadBalancer
