version: '3.8'

# ==============================================================================
# ICE ENGINE - FEDERATED DEPLOYMENT EXAMPLE (TWO PEERS + ONE AGGREGATOR)
# ==============================================================================
# This Docker Compose stack demonstrates a federated ICE setup with:
# - Two peer ICE nodes (ice-peer-1, ice-peer-2), each with its own PostgreSQL and Redis.
# - One aggregator ICE node (ice-aggregator), which queries both peers for memory.
# This setup simulates memory distributed across different locations or providers.

# --- GLOBAL CONFIGURATION ---
x-ice-env: &ice-env
  # Infrastructure Routing
  DATABASE_URL: postgres://ice_user:ice_password@localhost:5432/ice_db # Will be overridden per service
  REDIS_URL: redis://localhost:6379/0 # Will be overridden per service
  UPSTREAM_API_URL: http://172.17.0.1:11434 # Point to Ollama running on the host
  
  # Internal API Key for Peer-to-Peer Communication (MUST be the same across all ICE nodes)
  ICE_INTERNAL_API_KEY: "super-secret-federation-key" 

  # General Enterprise Hardware Governance
  ICE_MEMORY_CAP_GB: 8.0
  ICE_MAX_STITCH_CONCURRENCY: 10
  ICE_RETENTION_DAYS: 30
  ICE_LICENSE_JWT: eyJhbGciOiAiUlMyNTYiLCAidHlwIjogIkpXVCJ9..BecFR8Rn7FoJJY-1f4Oc5bN2UpUt5OT6kVhjNI8kj_LneVlB5a9C5SLL1lToz0BWcLupE2YMfCjC0AFzhN1hMumbQUuOiuHAJ30mRee-hqgV_R4VVfVVw1ojjDMGwpYVWuaDwPkmBPsrMbhxtw2v70mxbaiOc8QQcLbIwDpd07XSRzPAD4s_jLGpw-mYTFebKUKcaK3sXFG8tEVow98D_6smHFgc0A9Tz1EKDJzqtnsqbVJF3Kc8i3rpvAGs7IB9d-_6L0a-S0ul6FUFRqNTDfyX99BGj6jpxTzbPHvqbu80wy4LN_kOIbiKGVMdUnXoEpBGZMcfRAtwBrgpEcMeMw

services:
  # --- ICE PEER NODE 1 (Memory Shard 1) ---
  ice-peer-1:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    ports:
      - "8081:8000" # Expose on a different port for external access
    environment:
      <<: *ice-env
      DATABASE_URL: postgres://ice_user:ice_password@postgres-1:5432/ice_db_1
      REDIS_URL: redis://redis-1:6379/0
      # Peer nodes do NOT configure ICE_PEER_NODES themselves
    depends_on:
      postgres-1:
        condition: service_healthy
      redis-1:
        condition: service_started
  
  postgres-1:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_USER: ice_user
      POSTGRES_PASSWORD: ice_password
      POSTGRES_DB: ice_db_1
    volumes:
      - ice_pg_data_1:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ice_user -d ice_db_1"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  redis-1:
    image: redis:alpine

  # --- ICE PEER NODE 2 (Memory Shard 2) ---
  ice-peer-2:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    ports:
      - "8083:8000" # Expose on a different port for external access
    environment:
      <<: *ice-env
      DATABASE_URL: postgres://ice_user:ice_password@postgres-2:5432/ice_db_2
      REDIS_URL: redis://redis-2:6379/0
      # Peer nodes do NOT configure ICE_PEER_NODES themselves
    depends_on:
      postgres-2:
        condition: service_healthy
      redis-2:
        condition: service_started

  postgres-2:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_USER: ice_user
      POSTGRES_PASSWORD: ice_password
      POSTGRES_DB: ice_db_2
    volumes:
      - ice_pg_data_2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ice_user -d ice_db_2"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  redis-2:
    image: redis:alpine

  # --- ICE AGGREGATOR NODE (Queries Peer 1 and Peer 2) ---
  ice-aggregator:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    ports:
      - "8080:8000" # Default port for applications to connect to
    environment:
      <<: *ice-env
      DATABASE_URL: postgres://ice_user:ice_password@postgres-agg:5432/ice_db_agg
      REDIS_URL: redis://redis-agg:6379/0
      # AGGREGATOR specific config: List of peer nodes it should query
      ICE_PEER_NODES: "http://ice-peer-1:8000,http://ice-peer-2:8000"
    depends_on:
      postgres-agg:
        condition: service_healthy
      redis-agg:
        condition: service_started
      # Aggregator also depends on peers being up to query them
      ice-peer-1:
        condition: service_started
      ice-peer-2:
        condition: service_started

  postgres-agg:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_USER: ice_user
      POSTGRES_PASSWORD: ice_password
      POSTGRES_DB: ice_db_agg
    volumes:
      - ice_pg_data_agg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ice_user -d ice_db_agg"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  redis-agg:
    image: redis:alpine

volumes:
  ice_pg_data_1:
  ice_pg_data_2:
  ice_pg_data_agg: