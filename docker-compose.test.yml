# ICE Engine - Integration test stack
# ICE server + hermetic OTel collector so tests exercise a real OTLP export path.
version: "3.9"

services:
  ice:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ICE_TEST_MODE: "1"
      ICE_TELEMETRY_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      ICE_OTEL_SAMPLER: "parent_based_always_on"
      ICE_LOG_LEVEL: "DEBUG"
      ICE_SKIP_INFRA_CONNECT: "1"
      ICE_MOCK_LLM_CALL: "1"
    ports:
      - "8000:8000"
    depends_on:
      - otel-collector

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel-collector-config-ci.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
