apiVersion: v1
kind: Service
metadata:
  name: ice-engine-service
  namespace: default
  labels:
    app: ice-engine
spec:
  # In an enterprise environment, this might be a LoadBalancer or 
  # hooked up to an Ingress Controller (like NGINX or Traefik)
  type: ClusterIP
  selector:
    app: ice-engine
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 8080
