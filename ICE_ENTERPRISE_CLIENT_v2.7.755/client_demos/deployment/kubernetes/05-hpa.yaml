apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ice-engine-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ice-engine
    
  # Scale from 3 nodes up to 50 nodes during a traffic spike
  minReplicas: 3
  maxReplicas: 50
  
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
        
  # ICE relies heavily on memory for Context Paging assembly
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
