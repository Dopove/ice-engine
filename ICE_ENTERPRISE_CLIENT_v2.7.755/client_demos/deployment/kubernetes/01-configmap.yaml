apiVersion: v1
kind: ConfigMap
metadata:
  name: ice-config
  namespace: default
  labels:
    app: ice-engine
data:
  # ==============================================================================
  # ICE KERNEL DYNAMIC BOUNDS
  # ==============================================================================
  # Adjust these based on the physical limits of your Kubernetes Nodes.
  # If a node has 32GB of RAM, cap ICE at 28.0 to leave room for the OS.
  
  ICE_MEMORY_CAP_GB: "28.0"
  ICE_MAX_STITCH_CONCURRENCY: "100"
  ICE_RETENTION_DAYS: "365"
  ICE_CHUNK_SIZE: "8000"
  ICE_WORKERS: "4"
  
