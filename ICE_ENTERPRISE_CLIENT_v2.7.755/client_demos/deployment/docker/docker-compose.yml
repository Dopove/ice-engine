version: '3.8'

# ==============================================================================
# ICE ENGINE - LOCAL PRODUCTION TOPOLOGY
# ==============================================================================
# This stack spins up the ICE Engine alongside its required dependencies:
# PostgreSQL (Semantic Ledger) and Redis (Hot Window Cache).

services:
  ice-engine:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    command: >
      bash -c "python ice/setup_db.py && uvicorn ice.main:app --host 0.0.0.0 --port 8080 --workers \${ICE_WORKERS:-1}"
    environment:
      # 1. Infrastructure Routing
      - DATABASE_URL=postgres://ice_user:ice_password@postgres:5432/ice_db
      - REDIS_URL=redis://redis:6379/0
      
      # 2. Upstream LLM Providers
      - UPSTREAM_API_URL=http://host.docker.internal:11434 # Point to Ollama running on the host
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      
      # 3. Enterprise Hardware Governance
      - ICE_MEMORY_CAP_GB=16.0
      - ICE_MAX_STITCH_CONCURRENCY=50
      - ICE_RETENTION_DAYS=90
      
      # 4. Licensing (Use sample AWS License for local demo)
      - ICE_LICENSE_JWT=eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..N7dK5ZrHf7HC_Ltxjq9Tmew9CHqJYJFhZSpNW0Ik-G-s0tOJcYI1tYShHA-Jfrixvd_byATSHGWqxtwrI_Ati6SkU1zdPadFB8cKRmEWeEZK5jbLlsWbKlTVQz-a7jlDsKpZSbp3laYk39k7Z0jqL1LFNNmL56NOLyftGSBUzUM1fFj4nz_RntKhPYz5iVFx-mfQTd0Hf7RqHAQj8Gs--VyoFS8Pkcq1cVpJ8RcHkn56r8cmis10gNxKaGXxtRTh5TCzjHE8rrkcVznXWn__95sPYgzS1WppbxrcuHfwqw8fYCnR8A8trofvq0pCw6rZvqZ5j7Kq8aHuEfyi32mnXA
      - ICE_SKU=ICE-COMMUNITY
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # Semantic Ledger: Requires pgvector extension for HNSW embeddings
  postgres:
    image: ankane/pgvector:latest
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=ice_user
      - POSTGRES_PASSWORD=ice_password
      - POSTGRES_DB=ice_db
    volumes:
      - ice_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ice_user -d ice_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Hot Window Cache: Sub-10ms state synchronization
  redis:
    image: redis:alpine
    ports:
      - "6380:6379"

volumes:
  ice_pg_data: