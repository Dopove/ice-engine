# ICE v2.7.755: Reference Docker Compose Specification
# Demonstrates the integration of the ICE Engine with your internal database clusters.

services:
  ice-engine:
    image: your-private-registry/ice-engine:2.7.755
    ports:
      - "8008:8000"
    environment:
      # --- MANDATORY AUTHORIZATION ---
      - ICE_LICENSE_JWT=${ICE_LICENSE_JWT}

      # --- RESOURCE & STABILITY TUNING ---
      - ICE_MEMORY_CAP_GB=30.0
      - ICE_MAX_STITCH_CONCURRENCY=10
      - ICE_WORKERS=4

      # --- INTELLIGENCE PHYSICS ---
      - ICE_POST_COMPRESSION_LIMIT=128000
      - ICE_CHUNK_SIZE=12000
      - ICE_PRE_COMPRESSION_LIMIT=5
      - ICE_REASONING_RECALL_LIMIT=10

      # --- PERSISTENCE CONNECTIVITY ---
      - DATABASE_URL=postgres://user:pass@your-db-cluster:5432/ice_db
      - REDIS_URL=redis://your-cache-cluster:6379/0
      - UPSTREAM_API_URL=http://your-inference-node:11434/v1/chat/completions
    restart: always

---
