[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ice-engine"
version = "3.1.75"
description = "Indexless Context Engine (ICE) - Transparent proxy for unbounded SLM/LLM context"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "asyncpg",
    "redis",
    "orjson",
    "pydantic",
    "onnxruntime",
    "tokenizers",
    "numpy",
    "prometheus-fastapi-instrumentator",
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.22.0",
    "opentelemetry-instrumentation-fastapi>=0.43b0",
    "opentelemetry-instrumentation-asyncpg>=0.43b0",
    "opentelemetry-instrumentation-redis>=0.43b0",
    "opentelemetry-instrumentation-httpx>=0.43b0",
    "opentelemetry-propagator-tracecontext>=1.22.0"
]

[project.scripts]
ice = "ice.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ice*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
norecursedirs = ["RAG-Anything", "client_demos", "clients"]
