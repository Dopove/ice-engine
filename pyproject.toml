[build-system]
requires ["setuptools>=61.0", "wheel"]
build-backend "setuptools.build_meta"

[project]
name "ice-engine"
version "2.7.756"
description "Infinite ContextEngine (ICE)Transparent proxy unbounded SLM/LLM context"
readme "README.md"
requires-python ">=3.12"
license {text = "BSL-1.1"}
classifiers [
 "License :: Other/Proprietary License",
 "Programming Language Python 3",
 "Programming Language Python3.12",
 "Programming Language Python3.13",
 "Topic Software Development Libraries Python Modules",
]
dependencies [
 "fastapi",
 "uvicorn",
 "httpx",
 "asyncpg",
 "redis",
 "orjson",
 "pydantic",
 "onnxruntime",
 "tokenizers",
 "numpy",
 "prometheus-fastapi-instrumentator"
]

[project.scripts]
ice "ice.cli:main"

[tool.setuptools.packages.find]
where [".]
include ["ice*"]

[tool.pytest.ini_options]
asyncio_mode "auto"
asyncio_default_fixture_loop_scope "function"
norecursedirs ["RAG-Anything", "client_demos", "clients"]
