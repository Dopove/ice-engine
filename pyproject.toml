[build-system]
requires ["setuptools>=61.0", "wheel"]
build-backend "setuptools.build_meta"

[project]
name "ice-engine"
version "3.1.75"
description "Indexless ContextEngine (ICE)Transparent proxy unbounded SLM/LLM context"
readme "README.md"
requires-python ">=3.11"
license {text = "BSL-1.1"}
authors [
 {name = "Saran S", email = "sarans@dopove.com" }
]
keywords ["llm", "context", "memory", "proxy", "rag", "openai", "anthropic"]
classifiers [
 "Development Status 4 Beta",
 "Intended Audience Developers",
 "Programming Language Python 3",
 "Programming Language Python3.11",
 "Programming Language Python3.12",
 "Programming Language Python3.13",
 "License :: Other/Proprietary License",
 "Topic Software Development Libraries Python Modules",
]
dependencies [
 "fastapi",
 "uvicorn",
 "httpx",
 "asyncpg",
 "redis",
 "orjson",
 "pydantic",
 "onnxruntime",
 "tokenizers",
 "numpy",
 "duckdb>=1.0.0",
 "boto3",
 "fsspec",
 "tqdm",
 "rich",
 "arq",
 "psutil",
 "prometheus-fastapi-instrumentator",
 "opentelemetry-api>=1.22.0",
 "opentelemetry-sdk>=1.22.0",
 "opentelemetry-exporter-otlp-proto-grpc>=1.22.0",
 "opentelemetry-instrumentation-fastapi>=0.43b0",
 "opentelemetry-instrumentation-asyncpg>=0.43b0",
 "opentelemetry-instrumentation-redis>=0.43b0",
 "opentelemetry-instrumentation-httpx>=0.43b0"
]

[project.urls]
Repository "https://gitlab-server.tailbd4b1f.ts.net/dopove/ICE"

[project.scripts]
ice "ice.cli:main"

[tool.setuptools.packages.find]
where [".]
include ["ice*"]

[tool.pytest.ini_options]
asyncio_mode "auto"
asyncio_default_fixture_loop_scope "function"
norecursedirs ["RAG-Anything", "client_demos", "clients"]
