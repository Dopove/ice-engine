# ICE CI/CD Pipeline (GitLab)
# Mirrors .github/workflows/ci.yml: lint/security unit integration build deploy.
# Also includes publish stage for PyPI and GitHub mirror on tag push.
#
# NOTE: project's GitLab runner custom Fargate executor ignores
# `image:` runs fixed host (Debian, system Python3.11 PEP 668). Jobs
# therefore build own venv run tools against source tree with
# PYTHONPATH=. than `pip install -e .` (the package pins requires-python
# 3.12). `image:` kept portability runner ever swapped a
# docker executor.

stages:
 lint
 test
 integration
 build
 wheels
 release
 deploy
 publish

variables:
 PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
 PYTHONPATH: "$CI_PROJECT_DIR"
 AWS_DEFAULT_REGION: us-east-1
 DOCKER_HOST: tcp://docker:2375
 DOCKER_TLS_CERTDIR: ""

default:
 interruptible: true
 cache:
 key: "$CI_JOB_NAME"
 paths:
   - .cache/pip

.python:
 image: python:3.12
 before_script:
   - PYBIN=$(command -v python3.12 || command -v python3.11 || command -v python3)
   - "$PYBIN" -m venv .venv
   - . .venv/bin/activate
   - python --version
   - python -m pip install --upgrade pip
   - pip install -r requirements.txt test_requirements.txt

# ------------------------------------------------------------------
# LINT SECURITY
# ------------------------------------------------------------------
lint-and-security:
 extends: .python
 stage: lint
 # Non-blocking: codebase pre-existing lint/type backlog. job
 # reports it (ruff/black/mypy output + bandit/safety artifacts) without gating
 # pipeline. Tighten blocking once backlog cleared.
 allow_failure: true
 script:
 - pip install ruff black mypy bandit safety
 - ruff check ice/ tests/
 - black --check ice/ tests/
 - mypy ice/
 - bandit -r ice/ -f json -o bandit-report.json || true
 - safety check --json --output safety-report.json || true
 artifacts:
 when: always
 reports:
   sast: bandit-report.json
   dependency_scanning: safety-report.json

# ------------------------------------------------------------------
# TEST
# ------------------------------------------------------------------
test-unit:
 extends: .python
 stage: test
 script:
 - PYTHONPATH=. pytest tests/ -v --tb=short -k "not integration"

test-integration:
 extends: .python
 stage: integration
 services:
 - name: postgres:16-alpine
   alias: postgres
 - name: redis:7-alpine
   alias: redis
 - name: ollama/ollama:latest
   alias: ollama
 before_script:
 - . .venv/bin/activate
 - pip install psycopg2-binary redis httpx
 - python3 -c "import time, psycopg2, redis, httpx; pg=None; rd=None; om=None; [exec('try:\n pg=psycopg2.connect(host=\"postgres\",user=\"postgres\",password=\"postgres\",dbname=\"postgres\")\nexcept: pass') for _ in range(30)]; [exec('try:\n rd=redis.Redis(host=\"redis\",port=6379)\n rd.ping()\nexcept: pass') for _ in range(15)]; [exec('try:\n om=httpx.get(\"http://ollama:11434/api/tags\")\nexcept: pass') for _ in range(20)]"
 script:
 - PYTHONPATH=. pytest tests/ -v --tb=short -k "integration"

# ------------------------------------------------------------------
# BUILD
# ------------------------------------------------------------------
build:
 extends: .python
 stage: build
 script:
 - python3 scripts/build_ffi.py
 - echo "Build complete"

# ------------------------------------------------------------------
# WHEELS
# ------------------------------------------------------------------
build-wheels:
 extends: .python
 stage: wheels
 script:
 - pip install build
 - python3 -m build --wheel --sdist
 artifacts:
 when: always
 paths: [dist/]
 expire_in: 1 week

# ------------------------------------------------------------------
# RELEASE
# ------------------------------------------------------------------
create-release:
 extends: .python
 stage: release
 rules:
 - if: $CI_COMMIT_TAG
 script:
 - echo "Creating release for $CI_COMMIT_TAG"
 - python3 -m build --wheel --sdist
 - ls -la dist/

# ------------------------------------------------------------------
# DEPLOY
# ------------------------------------------------------------------
.terraform:
 image: hashicorp/terraform:1.9
 before_script:
 - cd deploy/terraform
 - terraform init -input=false

deploy-staging:
 extends: .terraform
 stage: deploy
 needs: ["build-and-push"]
 environment:
 name: staging
 rules:
 - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
 script:
 - terraform workspace select staging || terraform workspace new staging
 - terraform apply -auto-approve -input=false -var="image_tag=$CI_COMMIT_SHORT_SHA"

deploy-production:
 extends: .terraform
 stage: deploy
 needs: ["build-and-push"]
 environment:
 name: production
 rules:
 - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
   when: manual
   allow_failure: false
 script:
 - terraform workspace select production || terraform workspace new production
 - terraform plan -input=false -var="image_tag=$CI_COMMIT_SHORT_SHA"
 - terraform apply -auto-approve -input=false -var="image_tag=$CI_COMMIT_SHORT_SHA"
 after_script:
 - sleep 60
 - 'curl "https://$DOMAIN_NAME/v1/health"'
 - 'curl -f "https://$DOMAIN_NAME/v1/telemetry/status"'

# ------------------------------------------------------------------
# PUBLISH (new stage for tag pushes)
# ------------------------------------------------------------------
publish:pypi:
 stage: publish
 image: python:3.11-bookworm
 rules:
 - if: $CI_COMMIT_TAG =~ /^v.*-community$/
   variables:
     PACKAGE_DIR: "."
 before_script:
 - pip install build twine
 script:
 - |
   if [ -z "$TWINE_PASSWORD" ]; then
     echo "TWINE_PASSWORD not set; skipping PyPI upload"
     exit 0
   fi
   cd "$PACKAGE_DIR"
   python3 -m build --wheel --sdist
   twine upload --username __token__ --password "$TWINE_PASSWORD" dist/*
 artifacts:
 when: always
 paths: [dist/]
 expire_in: 1 week

publish:github:
 stage: publish
 image: python:3.11-bookworm
 rules:
 - if: $CI_COMMIT_TAG =~ /^v.*-community$/
 before_script:
 - apt-get update && apt-get install --no-install-recommends -y git
 script:
 - |
   if [ -z "$GITHUB_TOKEN" ]; then
     echo "GITHUB_TOKEN not set; skipping GitHub mirror"
     exit 0
   fi
   git remote add github https://oauth2:${GITHUB_TOKEN}@github.com/dopove/ICE.git 2>/dev/null || \
     git remote set-url github https://oauth2:${GITHUB_TOKEN}@github.com/dopove/ICE.git
   git push github main --tags -o ci.skip
   echo "GitHub mirror complete"

# ------------------------------------------------------------------
# NOTIFY
# ------------------------------------------------------------------
notify:
 stage: .post
 image: curlimages/curl:8.10.1
 rules:
 - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
   when: always
 script:
 - >
   test -z "$SLACK_WEBHOOK_URL" && echo "no SLACK_WEBHOOK_URL set, skipping" && exit 0;
 curl -sf -X POST -H 'Content-type: application/json' \
 --data "{\"channel\":\"#deployments\",\"text\":\"ICE pipeline $CI_PIPELINE_STATUS: finished $CI_COMMIT_REF_NAME ($CI_COMMIT_SHORT_SHA)\"}" \
 "$SLACK_WEBHOOK_URL"
