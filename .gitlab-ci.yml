# ICE CI/CD Pipeline (GitLab)
# Mirrors .github/workflows/ci.yml: lint/security -> unit -> integration -> build -> deploy.

stages:
  - lint
  - test
  - integration
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  AWS_DEFAULT_REGION: us-east-1
  # dind
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

default:
  interruptible: true
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - .cache/pip

# ------------------------------------------------------------------
# LINT & SECURITY
# ------------------------------------------------------------------
lint-and-security:
  stage: lint
  image: python:3.12
  before_script:
    - pip install -r requirements.txt -r test_requirements.txt
    - pip install -e .
  script:
    - ruff check ice/ tests/
    - black --check ice/ tests/
    - mypy ice/
    - bandit -r ice/ -f json -o bandit-report.json || true
    - safety check --json --output safety-report.json || true
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - bandit-report.json
      - safety-report.json

# ------------------------------------------------------------------
# UNIT TESTS
# ------------------------------------------------------------------
unit-tests:
  stage: test
  image: python:3.12
  needs: ["lint-and-security"]
  before_script:
    - pip install -r requirements.txt -r test_requirements.txt
    - pip install pytest pytest-asyncio pytest-cov pytest-mock httpx
    - pip install -e .
  script:
    - >
      pytest tests/unit/ -v --tb=short
      --cov=ice --cov-report=term-missing
      --cov-report=xml:coverage.xml
      --cov-fail-under=80
  coverage: '/^TOTAL.+?(\d+(?:\.\d+)?%)$/'
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# ------------------------------------------------------------------
# INTEGRATION TESTS
# ------------------------------------------------------------------
integration-tests:
  stage: integration
  image: docker:27
  services:
    - docker:27-dind
  needs: ["unit-tests"]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    ICE_TEST_MODE: "1"
    ICE_TELEMETRY_ENABLED: "true"
    ICE_OTEL_SAMPLER: "parent_based_always_on"
    ICE_LOG_LEVEL: "DEBUG"
    ICE_SKIP_INFRA_CONNECT: "1"
    ICE_MOCK_LLM_CALL: "1"
  script:
    - docker compose -f docker-compose.test.yml up -d --build
    - sleep 15
    - docker compose -f docker-compose.test.yml ps
    # pytest runs on the runner host; the compose stack publishes :8000 / :4317
    # on the dind daemon, reachable there as localhost from a --network host container.
    - |
      docker run --rm --network host -v "$CI_PROJECT_DIR":/app -w /app \
        -e ICE_TEST_MODE -e ICE_TELEMETRY_ENABLED -e ICE_OTEL_SAMPLER \
        -e ICE_LOG_LEVEL -e ICE_SKIP_INFRA_CONNECT -e ICE_MOCK_LLM_CALL \
        python:3.12 sh -c '
          set -e
          curl -f --retry 10 --retry-delay 3 --retry-connrefused http://localhost:8000/live
          pip install -q -r requirements.txt -r test_requirements.txt pytest pytest-asyncio pytest-mock httpx
          pip install -q -e .
          pytest tests/integration/ -v --tb=short
        '
  after_script:
    - docker compose -f docker-compose.test.yml down -v || true

# ------------------------------------------------------------------
# BUILD & PUSH IMAGE
# ------------------------------------------------------------------
build-and-push:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  needs: ["integration-tests"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - >
      docker build
      -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
      -t "$CI_REGISTRY_IMAGE:latest"
      .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
    - docker push "$CI_REGISTRY_IMAGE:latest"

# ------------------------------------------------------------------
# DEPLOY
# ------------------------------------------------------------------
.terraform:
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  before_script:
    - cd deploy/terraform
    - terraform init -input=false

deploy-staging:
  extends: .terraform
  stage: deploy
  needs: ["build-and-push"]
  environment:
    name: staging
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - terraform workspace select staging || terraform workspace new staging
    - terraform apply -auto-approve -input=false -var="image_tag=$CI_COMMIT_SHORT_SHA"

deploy-production:
  extends: .terraform
  stage: deploy
  needs: ["build-and-push"]
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  allow_failure: false
  script:
    - terraform workspace select production || terraform workspace new production
    - terraform plan -input=false -var="image_tag=$CI_COMMIT_SHORT_SHA"
    - terraform apply -auto-approve -input=false -var="image_tag=$CI_COMMIT_SHORT_SHA"
  after_script:
    - sleep 60
    - 'curl -f "https://$DOMAIN_NAME/v1/health"'
    - 'curl -f "https://$DOMAIN_NAME/v1/telemetry/status"'

# ------------------------------------------------------------------
# NOTIFY
# ------------------------------------------------------------------
notify:
  stage: .post
  image: curlimages/curl:8.10.1
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
  script:
    - >
      test -z "$SLACK_WEBHOOK_URL" && echo "no SLACK_WEBHOOK_URL set, skipping" && exit 0;
      curl -sf -X POST -H 'Content-type: application/json'
      --data "{\"channel\":\"#deployments\",\"text\":\"ICE pipeline ${CI_PIPELINE_STATUS:-finished} for $CI_COMMIT_REF_NAME ($CI_COMMIT_SHORT_SHA)\"}"
      "$SLACK_WEBHOOK_URL"
